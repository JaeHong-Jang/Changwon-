# ===== 프로젝트 설정 =====
project:
  name: "2026 창원시 AI·데이터 활용 공모전"
  team: ""
  topic: "창원시 폭우 침수·하수 역류 우선 대응지역 분석"

# ===== 경로 설정 =====
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  external_data: "data/external"
  figures: "reports/figures"
  reports: "reports/final"

# ===== 공공데이터 API =====
api:
  data_go_kr:
    base_url: "https://api.data.go.kr"
    api_key: ""  # .env 파일에서 관리 권장

# ===== 분석 설정 =====
analysis:
  random_seed: 42
  test_size: 0.2
  cv_folds: 5
  climatology_start: "2015-01-01"
  climatology_end: "2024-12-31"
  min_station_day_coverage: 0.90
  min_idw_stations_per_event: 24
  min_station_coord_coverage: 0.90   # 관측지점 좌표 확보율 하한 (h03_stations). 미달이면 공간보간 중단
  canonical_crs: "EPSG:5179"
  grid_size_m: 100

  # ----- 데이터 확인 EDA 판정 기준 (src/data/quality.py Thresholds) -----
  # 여기가 단일 원천이다. 코드에 하드코딩하면 값을 바꿔도 파이프라인 fingerprint 가
  # 그것을 모르고 캐시된 결과를 "통과 증거"로 남긴다.

  # 강수 이상은 절대 mm 가 아니라 공간 일관성(같은 해 이웃 지점 대비 비율)으로 판정한다.
  # 절대 기준으로 잡으면 2017년 같은 실제 가뭄년(29지점 전부 낮고 관측일수 정상)을 오탐한다.
  # 실측 비율 분포 std 0.12, 1~99% 가 0.71~1.28 이라 [0.5, 2.0] 밖은 명백한 이탈.
  # 주의: 검증 대상 데이터로 임계값을 정한 순환성이 있다. 다른 기간·지점망에는 재산정 필요.
  rainfall_station_ratio_min: 0.5
  rainfall_station_ratio_max: 2.0
  # 연총량 비교는 관측일수가 비슷할 때만 뜻이 있다. 관측이 끊긴 해는 값이 이상한 것이
  # 아니라 자료가 없는 것이므로 비교(분자·분모 모두)에서 빼고 따로 보고한다.
  rainfall_year_obsday_min: 0.95
  # 차단 기준이 아니라 "그 해가 기후적으로 특이했다"를 문서에 남기기 위한 참고선.
  rainfall_annual_min_mm: 700
  rainfall_annual_max_mm: 2600

  # 수위는 센티널이 많다는 것이 하네스 §2·§6-2 에 기록된 사실이다(차룡8교 유효일 85.6%).
  # 유효 셀 비율에 차단선을 두지 않고 "사례분석에 쓸 수 있는 지점이 남았는가"만 본다.
  river_usable_ratio_min: 0.10
  river_min_usable_stations: 1

  # SGIS 격자 통계를 분석격자로 자른 뒤 주민등록인구와 비교할 때의 허용 오차.
  sgis_pop_tolerance: 0.10
  # !! 출처 미확인 !! "약 100만(2024)" 어림값이며 기준일·출처 표기가 없다.
  # ±10% 관용치 안이라 현재 판정에는 영향이 없으나 보고서에 인용할 근거가 아니다.
  # 행정안전부 주민등록인구통계의 기준일자 값으로 교체하고 여기에 출처를 적을 것.
  changwon_registered_population: 1002000
