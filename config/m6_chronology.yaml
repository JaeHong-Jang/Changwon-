# 시각은 적지 않는다: src/repro/chronology.py 가 출처(JSON 키·run_id·git 커밋·gpkg·문서 인용)에서 직접 읽는다.
# git 출처는 origin/develop·origin/cloud/M1 커밋이 있어야 한다 (git fetch origin develop cloud/M1).
# precision: 초 = 기록된 실행 시각, 상한 = 이 시각까지는 존재(커밋 시각), 일 = 문서 날짜(KST), 미기록 = 시각 기록 없음.
