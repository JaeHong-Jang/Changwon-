    description: data_contracts 의 [sgis_aggregation_age, sgis_aggregation_summary, sgis_grid_statistics, sgis_aggregation_boundaries, sgis_grid_boundaries] 에 대해 구조(파일 수·컬럼·CRS)와 품질(중복·날짜·범위·센티널)을 검사하고 waiver 를 적용
