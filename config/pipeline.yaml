      - {kind: code, rule: "미승인 warning 0 — 품질 warning 은 waiver(사유·정제규칙·만료일) 로만 H02 에 이관"}
      - {kind: human, rule: "통계값·좌표·기간을 보고 '이 데이터를 분석에 써도 되는가' 판단 (못 쓰면 decisions 에 대안)"}
    approval: {who: R1, what: "하천수위 waiver 승인 및 사용 가능 판정 (임계치 완화 금지)"}
    on_fail: {goto: h00_collect_river, max_iterations: 5, action: "구조 error(파일·컬럼·CRS 불일치)면 수집부터 다시. 품질 warning 이면 waiver 작성 후 이 노드만 재실행"}

  h01_contract_small_tables:
    gate: H01
    phase: P1
    title: 펌프장·하천 목록 원본 검증
    description: data_contracts 의 [pump_stations, river_metadata] 에 대해 구조(파일 수·컬럼·CRS)와 품질(중복·날짜·범위·센티널)을 검사하고 waiver 를 적용
