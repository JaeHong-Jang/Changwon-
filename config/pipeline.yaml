    description: 묶음 5개 검증을 합쳐 전체 계약을 strict 로 한 번 더 판정하고 raw_validation.json 을 만든다 (H02 의 단일 입구)
    runner: src.stages.h01_contract:run
    depends_on: [h00_access_requests, h01_contract_rainfall, h01_contract_river, h01_contract_small_tables, h01_contract_sgis, h01_contract_geo]
    inputs:
      - config/data_contracts.yaml
      - config/raw_quality_waivers.yaml
      - "data/raw/**/*"
    outputs:
      - artifacts/validation/raw_validation.json
    params: []
    verify:
      - {kind: code, rule: "전체 계약 error 0, 미승인 warning 0, waiver fingerprint 일치·미만료"}
    on_fail: {goto: h01_raw_contract, max_iterations: 3, action: "묶음별 검증은 통과했는데 종합이 실패하면 waiver 만료·중복 fingerprint 문제 — waiver 파일 수정"}

  h02_rainfall_long:
    gate: H02
    phase: P2
    title: 강수 정제(long 변환)
    description: 강수 wide→long, quarantine, 2015~2024 29지점 coverage 유지
    runner: src.stages.h02_normalize:rainfall_long
    depends_on: [h01_raw_contract]
    inputs:
      - "data/raw/경상남도 창원시_시간별 강수량_*.csv"
    outputs:
      - data/processed/canonical/rainfall_hourly.parquet
      - data/processed/quarantine/rainfall_hourly.csv
    params:
      - analysis.climatology_start
      - analysis.climatology_end
      - analysis.min_station_day_coverage
    verify:
      - {kind: code, rule: "원행 분할 무결: canonical 의 source_row 집합과 행단위 quarantine 의 source_row 집합이 서로소이고 합집합이 원본 전체와 일치 (개수 비교는 구조상 항상 참이라 검증이 아니다)"}
      - {kind: code, rule: "정제 후 station_id+observed_at 키 중복 0"}
      - {kind: code, rule: "분석기간 cohort ≥ 29지점. 커버리지는 행 존재가 아니라 유효값(숫자·물리범위 내)이 있는 날 기준"}
    on_fail: {goto: h00_collect_rainfall, max_iterations: 3, action: "원인이 원본이면 강수 수집부터, 정제규칙이면 waiver 수정 후 강수 원본 검증부터 재실행. 임의 0 대체 금지"}

  h02_river_long:
    gate: H02
    phase: P2
    title: 하천수위 정제(long 변환)
    description: 하천수위 wide→long, 센티널 격리
    runner: src.stages.h02_normalize:river_long
    depends_on: [h01_raw_contract]
    inputs:
      - "data/raw/*하천*수위*.csv"
    outputs:
      - data/processed/canonical/river_level_hourly.parquet
      - data/processed/quarantine/river_level_hourly.csv
    params:
      - analysis.climatology_start
      - analysis.climatology_end
    verify:
      - {kind: code, rule: "원행 분할 무결: canonical 과 행단위 quarantine 이 원본을 정확히 나눠 가짐"}
      - {kind: code, rule: "셀 격리 회계: 센티널·범위밖으로 플래그된 셀 수와 quarantine 기록 수가 일치"}
      - {kind: code, rule: "분석기간에 유효값이 남은 지점 ≥ 1. 'level_cm 에 센티널 없음'은 정의상 항상 참이라 게이트가 될 수 없다"}
    on_fail: {goto: h00_collect_river, max_iterations: 3, action: "원인이 원본이면 수위 수집부터, 규칙이면 센티널·범위 규칙 수정 후 재실행"}

  h02_sgis_canonical:
    gate: H02
    phase: P2
    title: SGIS 통계 표준화
    description: headerless SGIS 100m·집계구 통계 4컬럼 canonical 변환
    runner: src.stages.h02_normalize:sgis_canonical
    depends_on: [h01_raw_contract]
    inputs:
      - "data/raw/sgis/**/*.csv"
    outputs:
      - data/processed/canonical/sgis_grid_statistics.parquet
      - data/processed/canonical/sgis_aggregation.parquet
    params: []
    verify:
      - {kind: code, rule: "파일 수·행수가 H01 보고서와 일치, 4개 계약 컬럼"}
    on_fail: {goto: h00_collect_sgis, max_iterations: 3, action: "원인이 원본이면 SGIS 수집부터, 매핑이면 헤더/컬럼 매핑 수정 후 이 노드만"}

  h02_eda_data_check:
    gate: H02
    phase: P2
    title: 데이터 확인 EDA
    description: 데이터 확인 EDA — 정제된 강수·수위·SGIS 가 "분석에 쓸 수 있는 데이터"인지 통계·좌표·기간으로 판정
    runner: src.stages.h02_eda:data_check
    depends_on: [h02_rainfall_long, h02_river_long, h02_sgis_canonical, h03_grid_base]
    inputs: []
    outputs:
      - reports/figures/eda_data_check/rainfall_station_coverage.png
      - reports/figures/eda_data_check/rainfall_annual_totals.png
      - reports/figures/eda_data_check/river_level_validity.png
      - reports/figures/eda_data_check/sgis_population_map.png
      - docs/eda_data_check.md
    params:
      - analysis.climatology_start
      - analysis.climatology_end
      - analysis.min_station_day_coverage
      - analysis.rainfall_station_ratio_min
      - analysis.rainfall_station_ratio_max
      - analysis.rainfall_year_obsday_min
      - analysis.rainfall_annual_min_mm
      - analysis.rainfall_annual_max_mm
      - analysis.river_usable_ratio_min
      - analysis.river_min_usable_stations
      - analysis.sgis_pop_tolerance
      - analysis.changwon_registered_population
    verify:
      - {kind: code, rule: "강수 지점 공간일관성: 관측일 95% 이상인 지점-연도 중 같은 해 지점 중앙값 대비 50~200% 밖 0개. 절대 mm 기준이 아니라 이웃 지점과의 어긋남으로 판정하고(2017 가뭄년 오탐 방지), 관측 중단 연도는 결측이므로 비교에서 빼되 그 해 중앙값(분모) 계산에서도 빼고 따로 보고한다"}
      - {kind: code, rule: "수위: 센티널이 정제된 level_cm 에 0건 누출, 사례분석에 쓸 수 있는 지점(유효값 비율 ≥ river_usable_ratio_min) ≥ river_min_usable_stations. 유효 셀 비율 자체는 하네스 §2 가 이미 낮다고 기록했으므로 차단선이 아니라 기록 대상"}
      - {kind: code, rule: "SGIS 격자 통계를 분석격자(h03_grid_base)로 자른 뒤 총인구 합이 창원 주민등록인구의 ±sgis_pop_tolerance 이내. 원본 CSV 는 전국 도엽이라 자르기 전에는 비교 자체를 하지 않는다"}
      - {kind: human, rule: "그림 4장과 eda_data_check.md 의 '이상 징후' 목록을 보고 데이터 원인인지 정제 원인인지 판단"}
    approval: {who: R1, what: "데이터 확인 완료 — 이 canonical 로 격자·피처 구축 진행"}
    on_fail: {goto: h00_collect_rainfall, max_iterations: 3, action: "원인이 데이터면 그 묶음의 수집 노드(강수/수위/SGIS)로, 정제 규칙이면 해당 h02_* 수정 후 재실행. 어느 쪽인지 eda_data_check.md 에 기록"}

  h03_boundary:
    gate: H03
    phase: P2
    title: 창원시 경계 파생
    description: 이미 받은 SGIS 집계구 경계(38111~38115 = 창원 5개 구)를 ADM_CD 로 합쳐(dissolve) 읍면동·구·시 3단계 경계를 만든다. 별도 다운로드 불필요
    runner: src.stages.h03_spatial:boundary
    depends_on: [h01_contract_sgis]
    inputs:
      - "data/raw/sgis/aggregation_boundaries_2025_2Q/*"
    outputs:
      - data/processed/spatial/changwon_boundary.gpkg
    params:
      - analysis.canonical_crs
      - analysis.grid_size_m
    verify:
      - {kind: code, rule: "구 5개(38111~38115)·읍면동 전부 존재, geometry valid 100%, EPSG:5179, 구끼리 겹침 < 격자 1칸(10,000 m²) — 그보다 작은 접합부 슬리버는 격자 배정을 바꾸지 못함"}
      - {kind: external, rule: "시 전체 면적이 창원시 공식 면적(약 748 km²)의 ±1% 이내"}
      - {kind: human, rule: "지도에서 진해구·마산합포구 해안선과 섬이 빠지지 않았는지"}
    on_fail: {goto: h00_collect_sgis, max_iterations: 2, action: "집계구 누락이면 SGIS 집계구 경계 재수집. 면적 불일치가 해안 매립 차이면 decisions 에 기록하고 통과. 대안: SGIS 행정구역경계 직접 신청"}

  h03_flood_maps:
    gate: H03
    phase: P2
    title: 침수예상도 정규화
    description: 창원 침수예상도 13개 레이어(A1)를 EPSG:5181 에서 분석 CRS 로 재투영하고, WFS 응답에서 깨진 한글(cp949 를 latin1 로 디코딩)을 복원한다
    runner: src.stages.h03_spatial:flood_maps
    depends_on: [h03_boundary]
    inputs:
      - "data/raw/flood_maps/changwon_wfs/*.geojson"
    outputs:
      - data/processed/canonical/flood_maps.gpkg
    params:
      - analysis.canonical_crs
    verify:
      - {kind: code, rule: "원본 CRS 가 EPSG:5181 이고 변환 후 EPSG:5179, invalid geometry 0"}
      - {kind: code, rule: "침수심 구간 문자열이 전부 대표값(m)으로 매핑됨 — 미매핑 0"}
      - {kind: code, rule: "한글 복원 표본이 비어 있지 않음 (복원이 조용히 건너뛰어지는 것을 막는다)"}
      - {kind: human, rule: "복원된 지구명이 실제 창원 지명인지 확인 (마산·진해·남포 등)"}
    on_fail: {goto: h03_flood_maps, max_iterations: 3, action: "원본을 다시 받거나(python -m src.data.fetch_open_data --only a1_...) 인코딩·CRS 처리를 수정"}

  h03_grid_base:
    gate: H03
    phase: P2
    title: 100m 분석격자 구축
    description: 창원시 경계로 SGIS 100m 격자 clip, EPSG:5179 통일
    runner: src.stages.h03_spatial:grid_base
    depends_on: [h03_boundary]
    inputs:
      - "data/raw/sgis/grid_boundaries_100m_2025/*"
    outputs:
      - data/processed/spatial/grid_base.gpkg
    params:
      - analysis.canonical_crs
      - analysis.grid_size_m
    verify:
      - {kind: code, rule: "geometry valid 100%, 격자 전부 창원 경계 내부, EPSG:5179"}
    on_fail: {goto: h03_grid_base, max_iterations: 3, action: "경계 파일·clip 규칙 수정"}

  h03_stations:
    gate: H03
    phase: P2
    title: 관측지점 좌표 결합
    description: 강수 29지점·수위계 2지점 좌표 결합 (확보율 ≥90% 미달 시 중단, 근사점은 is_proxy 표시)
    runner: src.stages.h03_spatial:stations
    depends_on: [h02_eda_data_check, h03_boundary, h02_rainfall_long]
    inputs:
      - data/external/stations.csv
    outputs:
      - data/processed/spatial/stations.gpkg
    params:
      - analysis.canonical_crs
      - analysis.min_idw_stations_per_event
      - analysis.min_station_coord_coverage
      - analysis.climatology_start
      - analysis.climatology_end
      - analysis.min_station_day_coverage
    verify:
      - {kind: code, rule: "좌표 확보율 ≥ min_station_coord_coverage, 위경도 뒤바뀜·중복 코드 0, 전 지점 창원 경계 안, 좌표 있는 강수 cohort 지점 ≥ min_idw_stations_per_event"}
    on_fail: {max_iterations: 2, action: "분기: 확보율 미달이면 공간보간 중단하고 docs/decisions 에 대안 기록"}

  h03_pump_stations:
    gate: H03
    phase: P2
    title: 펌프장 좌표 결합·검수
    description: 창원시 배수펌프장 표준데이터 공식 좌표 15개 + 공식 목록에 없는 지오코딩 펌프장(수동 검수) 결합
    runner: src.stages.h03_spatial:pump_stations
    depends_on: [h02_eda_data_check, h03_boundary]
    inputs:
      - data/raw/경상남도_창원시_배수펌프장_20260731.csv
      - data/external/pump_stations_geocoded.csv
    outputs:
      - data/processed/spatial/pump_stations.gpkg
    params:
      - analysis.canonical_crs
    verify:
      - {kind: human, rule: "지오코딩으로 추가된 펌프장 좌표를 지도에서 육안 검수, reviewed=Y 플래그"}
      - {kind: code, rule: "공식 좌표 결측 0, 추가분 전부 reviewed=Y, 전 지점 창원 경계 안"}
    approval: {who: R1, what: "펌프장 좌표 최종 확정 — 공식 15 + 지오코딩 추가분 (이후 거리변수 생성 허용)"}
    on_fail: {goto: h03_pump_stations, max_iterations: 3, action: "오지오코딩 주소 수동 보정"}

  h04_grid_features:
    gate: H04
    phase: P2
    title: 격자 피처 결합
    description: DEM·토지피복·침수예상도·펌프장·인구를 100m 격자망 위에서 계산해 결합, 핵심 변수 결측 <5%
    runner: src.stages.h04_features:grid_features
    depends_on: [h03_grid_base, h03_stations, h03_pump_stations, h03_flood_maps, h02_sgis_canonical]
    inputs:
      - "data/raw/dem/**/*.img"
      - "data/raw/land_cover/**/*.shp"
      - data/raw/rivers/osm_waterways.gpkg
    outputs:
      - data/processed/features/grid_features.parquet
      - docs/data_dictionary.md
    params:
      - analysis.canonical_crs
      - analysis.grid_size_m
      - features.raster_subdivision
      - features.relative_elevation_radius_m
      - features.pump_service_radius_m
      - features.sgis_year
      - features.max_missing_rate
    verify:
      - {kind: code, rule: "핵심 변수 결측 < max_missing_rate, 변수별 출처·방향·단위가 data_dictionary 에 존재, 라벨(침수흔적·민원) 미사용 기록"}
    on_fail: {goto: h04_grid_features, max_iterations: 3, action: "결측 5% 초과 변수 제외 또는 대체 근거를 data_dictionary 에 기록"}

  h05_holdout_freeze:
    gate: H05
    phase: P2
    title: 민원 홀드아웃 동결
    description: 민원 메타데이터만으로 개발/최종 홀드아웃 분리·checksum 동결
    runner: src.stages.pending:holdout_freeze
    depends_on: [h01_raw_contract]
    inputs:
      - "data/raw/complaints/*meta*.csv"
    outputs:
      - artifacts/evaluation/holdout_manifest.json
    optional: true   # 2026-09-01 민원 비공개 회신 — docs/decisions/001. 실패해도 하류를 막지 않는다
    params:
      - analysis.random_seed
    verify:
      - {kind: code, rule: "분할 규칙·checksum 기록, 최종 홀드아웃 원문 접근 횟수 0"}
    approval: {who: R3, what: "홀드아웃 custodian 으로서 분할 동결 승인 — 이후 변경 불가"}
    on_fail: {goto: h05_holdout_freeze, max_iterations: 2, action: "분할 규칙 수정. 원문 열람 전에만 허용"}

  h05_complaint_extract:
    gate: H05
    phase: P2
    title: 민원 LLM 구조화
    description: 개발세트 원문만 LLM 구조화, extractor manifest 동결
    runner: src.stages.pending:complaint_extract
    depends_on: [h05_holdout_freeze]
    inputs:
      - "data/raw/complaints/*dev*.csv"
      - docs/complaint_taxonomy.md
    outputs:
      - data/processed/canonical/complaints_development.parquet
      - artifacts/evaluation/complaint_extractor_manifest.json
      - data/processed/spatial/evaluation_points.gpkg
    optional: true   # 2026-09-01 민원 비공개 회신 — docs/decisions/001. 실패해도 하류를 막지 않는다
    params: []
    verify:
      - {kind: human, rule: "LLM 추출 결과 표본 검수 — 필드별 정확도·사람검수율 기록"}
      - {kind: code, rule: "extractor 코드·프롬프트·모델·taxonomy checksum 이 manifest 에 고정"}
    approval: {who: R2, what: "taxonomy 와 extractor 동결 승인 (이후 프롬프트 수정 시 재승인)"}
    on_fail: {goto: h05_complaint_extract, max_iterations: 3, action: "프롬프트/taxonomy 수정 후 재추출. 비용 상한: 3회"}

  h06_layer1_flood:
    gate: H06
    phase: P3
    title: Layer 1 침수취약성
    description: 기후노출(IDW 강수 4변수) × 도시민감도(지형·피복·배수) → z-score 합산 → Jenks 4등급 매트릭스
    runner: src.stages.h06_layers:layer1_flood
    depends_on: [h04_grid_features, h03_stations, h02_rainfall_long]
    inputs:
      - "data/raw/flood_traces/**/*"   # 선택 입력 — 2026-09-14 정보공개 회신분. 없으면 label_available=false
    outputs:
      - data/processed/layers/layer1_flood.gpkg
    params:
      - analysis.canonical_crs
      - analysis.random_seed
      - analysis.climatology_start
      - analysis.climatology_end
      - analysis.min_idw_stations_per_event
      - layer1.idw_powers
      - layer1.idw_k
      - layer1.idw_max_dist_m
      - layer1.river_proximity_m
      - layer1.winsor_lo
      - layer1.winsor_hi
      - layer1.n_classes
      - layer1.case_study_lift_min
      - layer1.trace_auc_min
      - layer1.trace_top20_capture_min
    verify:
      - {kind: code, rule: "IDW 사용 지점 ≥ min_idw_stations_per_event, L1 결측 0, 등급 I~IV 가 모두 나타남"}
      - {kind: external, rule: "사례지 5개 동 I·II등급 lift ≥ case_study_lift_min. 행정동 이름 매핑이 없으면 case_study.available=false 로 기록하고 판정하지 않는다 (face-validity 점검)"}
      - {kind: external, rule: "침수흔적 라벨이 있으면 ROC-AUC ≥ trace_auc_min, 상위 20% 포착률 ≥ trace_top20_capture_min. 없으면 label_available=false 로 기록하고 예측 성능 주장 금지"}
    on_fail: {goto: h04_grid_features, max_iterations: 3, action: "피처·부호 재검토. 라벨 부족 시 예측 성능 주장 금지로 전환"}

  h06_layer2_sewer:
    gate: H06
    phase: P3
    title: Layer 2 하수역류
    description: Layer 2 역류위험 (Plan B 인프라 baseline, 조건 충족 시 Plan A challenger)
    runner: src.stages.pending:layer2_sewer
    depends_on: [h04_grid_features]
    inputs:
      - docs/decisions/001-layer2-design.md
      - data/processed/canonical/complaints_development.parquet   # Plan A 일 때만 존재 (정보공개청구 회신 후)
      - "data/raw/*하수도통계*.xlsx"                                 # A9 환경부 하수도통계 (Plan B 입력, 보유)
      - "data/raw/sewer/**/*"                                      # 관로 연도·좌표 (정보공개청구 회신 후)
    outputs:
      - data/processed/layers/layer2_sewer.gpkg
    optional: true   # decision 001 — 관로 비공개로 검증 불가. CDRI 기본 산식에서 제외하고 시나리오로만
    params:
      - analysis.random_seed
      - analysis.cv_folds
    verify:
      - {kind: external, rule: "Plan A 이면 개발세트 AUC 보고; 민원 부재를 음성으로 쓰지 않았는지 점검"}
      - {kind: code, rule: "docs/decisions/001-layer2-design.md 의 plan 과 산출 일치"}
    approval: {who: R3, what: "Decision Gate: 정보공개 회신 상태에 따라 Plan A/B 또는 Layer2 제외 결정"}
    on_fail: {goto: h06_layer2_sewer, max_iterations: 2, action: "Plan B 로 강등 또는 Layer2 제외를 decisions 에 기록"}

  h06_layer3_vuln:
    gate: H06
    phase: P3
    title: Layer 3 취약계층·대응역량
    description: 노출 E(인구·주택 수) / 취약성 V(65세 이상 비율) / 대응역량 부족도(대피소·방재기관 거리)
    runner: src.stages.h06_layers:layer3_vuln
    depends_on: [h04_grid_features, h02_sgis_canonical]
    inputs:
      - "data/raw/sgis/aggregation_boundaries_2025_2Q/*"
      - "data/raw/shelters/*.json"
    outputs:
      - data/processed/layers/layer3_vuln.gpkg
    params:
      - analysis.canonical_crs
      - features.sgis_year
      - layer1.winsor_lo
      - layer1.winsor_hi
      - layer1.n_classes
      - layer3.capacity_max_dist_m
    verify:
      - {kind: code, rule: "65세 이상은 확정된 연령 코드북으로만 파생(노령화지수 항등식 대조), 집계구 조인율 >= 95%, E/V/capacity_deficit 결측 0"}
    on_fail: {goto: h06_layer3_vuln, max_iterations: 2, action: "코드북·집계구 경계 확인 후 재실행"}

  h07_cdri:
    gate: H07
    phase: P3
    title: CDRI 통합·민감도
    description: H(Layer 1)·E·V·Capacity 부족도 가중기하평균 + 가중치/집계형/MAUP/등급화 민감도
    runner: src.stages.h07_cdri:cdri
    depends_on: [h06_layer1_flood, h06_layer3_vuln]
    inputs:
      - data/processed/layers/layer2_sewer.gpkg   # 선택 입력 — 있으면 시나리오 하나를 더 만든다
    outputs:
      - data/processed/layers/cdri.gpkg
      - reports/tables/sensitivity.csv
      - reports/tables/grade_by_dong.csv
      - artifacts/evaluation/primary_formula_manifest.json
    params:
      - analysis.random_seed
      - cdri.top_n
      - cdri.rescale_floor
      - cdri.min_spearman
      - cdri.min_top20_overlap
    verify:
      - {kind: code, rule: "변형 간 중위 Spearman rho >= min_spearman, TOP 20 중첩 >= min_top20_overlap, Capacity 결측 0 대체 없음, 등급 규칙으로 바뀐 격자 <= 5% (decisions/003)"}
    approval: {who: R3, what: "primary 산식·가중치 확정. 승인 후 재조정 금지 (retuning_prohibited)"}
    on_fail: {max_iterations: 1, action: "분기: 강건성 미달이면 정밀 순위 대신 위험군(tier) 모드로 보고. 재튜닝 루프 금지"}

  h08_top20_policy:
    gate: H08
    phase: P4
    title: 우선대응 지역 정책화
    description: 300m NMS 로 선정한 격자에 트리거-행동 계약(정책카드) 부여. CDRI 가 tier 모드면 정밀 순위를 주장하지 않는다
    runner: src.stages.h08_policy:top20
    depends_on: [h07_cdri]
    inputs: []
    outputs:
      - reports/tables/top20.csv
      - artifacts/evaluation/final_holdout_evaluation.json
    params:
      - cdri.top_n
      - policy.nms_radius_m
    verify:
      - {kind: code, rule: "격자마다 트리거·담당·조치·KPI 존재. 없는 항목은 표에서 제외"}
      - {kind: external, rule: "민원 홀드아웃 최종 1회 평가 — 비공개로 수행 불가. holdout_evaluated=false 로 기록하고 침수흔적 검증으로 대체 (decision 001)"}
    approval: {who: R3, what: "최종 우선대응 지역과 정책카드 제출 승인. 평가 후 공식·가중치 재조정 금지"}
    on_fail: {max_iterations: 1, action: "루프 없음. 실패 시 결과를 그대로 보고하고 한계로 기술"}

  h08_result_review:
    gate: H08
    phase: P4
    title: 결과 확인 EDA
    description: 결과 확인 EDA — TOP 20·CDRI 분포·기여도를 독립 침수자료(A1 침수예상도·A7 홍수위험지도)와 대조
    runner: src.stages.pending:result_review
    depends_on: [h08_top20_policy]
    inputs:
      - "data/raw/flood_maps/**/*"
    outputs:
      - reports/figures/result_review/cdri_distribution.png
      - reports/figures/result_review/top20_vs_flood_maps.png
      - docs/result_review.md
    params: []
    verify:
      - {kind: external, rule: "TOP 20 격자와 A1/A7 침수구역 중첩률 보고 — 기준 미달이면 '왜 다른가'를 result_review.md 에 설명"}
      - {kind: code, rule: "TOP 20 의 기여도 3성분 합 = 100%, 동 단위 편중(한 동 > 50%) 없음"}
      - {kind: human, rule: "지도를 보고 상식적으로 설명 가능한 결과인지 (사례지 5개 동 포함 여부 등)"}
    approval: {who: R3, what: "결과 타당성 확인 — 보고서 작성 진행"}
    on_fail: {goto: h04_grid_features, max_iterations: 2, action: "결과가 데이터·피처 문제면 h04 로, 산식 문제면 h07 로 (h07 은 재튜닝 금지이므로 decisions 에 사유 기록). 수집 문제면 해당 h00_collect_*"}

  h09_alert_draft:
    gate: H09
    phase: P4
    title: 알림 문안 초안(옵션)
    description: (옵션) 고정 TOP 20 + 유효 예보로 내부 검토용 문안 1건
    runner: src.stages.pending:alert_draft
    depends_on: [h08_result_review]
    optional: true
    inputs: []
    outputs:
      - reports/figures/alert_example.png
    params: []
    verify:
      - {kind: code, rule: "계산값 일치 100%, 만료·단위·timezone 불일치 예보 차단, 자동발송 0건"}
    approval: {who: R3, what: "내부 검토용 문안 1건 확인 — 외부 발송 금지"}
    on_fail: {max_iterations: 1, action: "분기: 텍스트 예시로 축소하고 핵심 분석 일정 유지"}

  h10_reproducibility:
    gate: H10
    phase: P4
    title: 재현성·환류 검증
    description: 빈 processed 환경 전체 재실행 + 환류 manifest 검증
    runner: src.stages.pending:reproducibility
    depends_on: [h08_result_review]
    inputs: []
    outputs:
      - artifacts/evaluation/feedback_manifest.json
    params: []
    verify:
      - {kind: code, rule: "빈 processed 에서 전체 재실행 pass, 홀드아웃 결과 checksum 불변, feedback manifest 필수키"}
    on_fail: {goto: h00_access_requests, max_iterations: 2, action: "마지막 성공 run 으로 복귀하고 실패 원인 기록. 전체 재실행이므로 P1 처음부터"}

