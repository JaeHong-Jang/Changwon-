# 하네스 실행 DAG 선언 (docs/PIPELINE_DAG.md 참조)
#
# 노드 하나 = 재실행·캐시·증거 기록의 최소 단위.
# 실행기(src/pipeline)는 이 파일만 보고 순서를 정하고, 각 노드의
#   fingerprint = runner 코드 + inputs 내용 + params 값 + 상류 노드 fingerprint
# 가 바뀌지 않았고 outputs가 그대로면 건너뛴다.
#
# 필드
#   gate        : docs/RESEARCH_HARNESS.md §5의 게이트 ID
#   runner      : "모듈경로:함수" — def f(ctx: StageContext) -> dict (metrics)
#   depends_on  : 먼저 통과해야 하는 노드
#   inputs      : 내용 checksum에 포함할 파일/glob (프로젝트 루트 기준)
#   outputs     : 실행 후 반드시 존재해야 하는 파일. 없으면 게이트 실패
#   params      : config/config.yaml의 점 경로. 값이 바뀌면 재실행
#   optional    : true면 실패해도 하류를 막지 않고 skipped로 기록 (H09)
#
# 오케스트레이션 필드 (docs/PIPELINE_DAG.md §3-2 — "누가 검증·거부하고, 실패하면 어디로 가나")
#   verify      : 판정 주체. kind = code(결정적 검사) | external(독립 외부 증거) | human(사람 검수)
#                 runner는 code/external 검사에서 미달이면 StageFailed를 던진다. human은 approval로 연결.
#   approval    : 사람 거부권. pass 후에도 outputs checksum에 묶인 승인 기록
#                 (artifacts/approvals/<node>.yaml, `python -m src.pipeline approve`)이 없으면
#                 awaiting_approval 로 멈추고 하류를 열지 않는다.
#   on_fail     : 실패 시 되돌아갈 노드(goto)와 시도 상한(max_iterations). 되감기는 사람이 수정 후
#                 재실행하는 것이고, 실행기는 횟수를 세어 상한 초과 시 exhausted 로 막는다.
#                 goto 가 없으면 "분기"(예: tier 모드 강등)이며 action 에 적는다.
#   title       : 그림·표에 쓰는 한글 이름 (id 는 명령어용)
#   phase       : 큰 단계 P1~P4 (아래 phases). "어느 큰 단계에서 막혔나"를 보고, 루프백은 단계를 넘어갈 수 있다.
version: 1

phases:
  P1: {title: "데이터 확보·검증", exit: "모든 계약 데이터가 취득 기록·checksum과 함께 존재하고 H01 strict 통과"}
  P2: {title: "전처리·EDA", exit: "canonical·격자·피처가 만들어지고 데이터 확인 EDA가 이상 없음으로 닫힘"}
  P3: {title: "방법론 검증", exit: "Layer 1~3과 CDRI가 외부 증거·강건성 기준을 통과하고 산식이 확정됨"}
  P4: {title: "결과 확인·보고", exit: "TOP 20이 결과 EDA·홀드아웃 평가를 거쳐 제출 승인되고 재현성 검증 통과"}

nodes:
  h00_access_requests:
    gate: H00
    phase: P1
    title: 데이터 접근신청 현황
    description: 정보공개청구·API 키·기관 자료신청 17건의 신청일·접수번호·회신 상태가 data_access_log 에 기록됐는지. 미회신 필수 데이터가 있으면 Plan B 를 결정
    runner: src.stages.h00_collect:access_requests
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - docs/DATA_CATALOG.md
    outputs:
      - artifacts/validation/access_requests.json
    params: []
    verify:
      - {kind: code, rule: "access_log 의 모든 행에 상태(미신청/대기/수령/거부)가 있고 '미신청' 인 필수 항목 0개"}
      - {kind: human, rule: "미수령 항목이 현재 분석 범위에 필수인지, 대안(Plan B)이 있는지"}
    approval: {who: R1, what: "수집 범위 확정 — 미수령 데이터는 docs/decisions 에 대안 기록"}
    on_fail: {goto: h00_access_requests, max_iterations: 10, action: "미신청 건 신청하고 접수번호 기록. 거부면 대안 결정 기록"}

  h00_collect_rainfall:
    gate: H00
    phase: P1
    title: 강수량 수집 확인
    description: 36지점 시간별 강수. 2015~2024 완전연도 29지점 cohort 가 성립하는지. 파일이 실제로 있고(LFS 포인터 아님) 취득일·출처 URL·md5 가 README 에 기록됐는지
    runner: src.stages.h00_collect:inventory
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - data/raw/README.md
      - "data/raw/경상남도 창원시_시간별 강수량_*.csv"
    outputs:
      - artifacts/validation/collection_rainfall.json
    params: []
    verify:
      - {kind: code, rule: "계약의 해당 dataset 파일이 전부 존재, LFS 포인터 0개, README 에 취득일·URL·md5 기록"}
      - {kind: human, rule: "출처가 공식 포털인지, 관측 기간이 분석 기간 2015~2024 를 전부 덮는지"}
    on_fail: {goto: h00_collect_rainfall, max_iterations: 5, action: "누락·구버전이면 재다운로드/재청구하고 README 에 취득 기록 후 재실행"}

  h00_collect_river:
    gate: H00
    phase: P1
    title: 하천수위 수집 확인
    description: 8지점. 센티널·0 구간이 많아 도시 전체 검증자료로는 못 쓰고 2지점만 보조로. 파일이 실제로 있고(LFS 포인터 아님) 취득일·출처 URL·md5 가 README 에 기록됐는지
    runner: src.stages.h00_collect:inventory
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - data/raw/README.md
      - "data/raw/경상남도 창원시_하천수위 통계_*.csv"
    outputs:
      - artifacts/validation/collection_river.json
    params: []
    verify:
      - {kind: code, rule: "계약의 해당 dataset 파일이 전부 존재, LFS 포인터 0개, README 에 취득일·URL·md5 기록"}
      - {kind: human, rule: "출처가 공식 포털인지, 관측 기간이 2015~2024 를 덮는지 (센티널·0 구간은 H02 에서 격리)"}
    on_fail: {goto: h00_collect_river, max_iterations: 5, action: "누락·구버전이면 재다운로드/재청구하고 README 에 취득 기록 후 재실행"}

  h00_collect_small_tables:
    gate: H00
    phase: P1
    title: 펌프장·하천 목록 수집 확인
    description: 펌프장 9행(주소만), 하천 53행(좌표 없음). 지오코딩 전엔 위치자료 아님. 파일이 실제로 있고(LFS 포인터 아님) 취득일·출처 URL·md5 가 README 에 기록됐는지
    runner: src.stages.h00_collect:inventory
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - data/raw/README.md
      - "data/raw/경상남도_창원시_배수펌프장 현황_*.csv"
      - "data/raw/river/*.csv"
    outputs:
      - artifacts/validation/collection_small_tables.json
    params: []
    verify:
      - {kind: code, rule: "계약의 해당 dataset 파일이 전부 존재, LFS 포인터 0개, README 에 취득일·URL·md5 기록"}
      - {kind: human, rule: "출처가 창원시 공식 자료인지, 현재 운영 중인 시설 목록인지 (기간 개념 없음 — 최신 현황 1개)"}
    on_fail: {goto: h00_collect_small_tables, max_iterations: 5, action: "누락·구버전이면 재다운로드/재청구하고 README 에 취득 기록 후 재실행"}

  h00_collect_sgis:
    gate: H00
    phase: P1
    title: SGIS 인구 통계·경계 수집 확인
    description: 100m 격자·집계구 통계 27파일 + 경계 9세트. 헤더 없는 CSV, EPSG:5179. 파일이 실제로 있고(LFS 포인터 아님) 취득일·출처 URL·md5 가 README 에 기록됐는지
    runner: src.stages.h00_collect:inventory
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - data/raw/README.md
      - "data/raw/sgis/**/*"
    outputs:
      - artifacts/validation/collection_sgis.json
    params: []
    verify:
      - {kind: code, rule: "계약의 해당 dataset 파일이 전부 존재, LFS 포인터 0개, README 에 취득일·URL·md5 기록"}
      - {kind: human, rule: "출처가 SGIS 공식인지, 통계 기준연도(2024)와 경계 버전이 서로 맞는지 (시계열 아님 — 최신 1개)"}
    on_fail: {goto: h00_collect_sgis, max_iterations: 5, action: "누락·구버전이면 재다운로드/재청구하고 README 에 취득 기록 후 재실행"}

  h00_collect_geo:
    gate: H00
    phase: P1
    title: 토지피복·DEM 수집 확인
    description: 토지피복 16세트(EPSG:5186→재투영 필요), DEM 90m 6타일. 파일이 실제로 있고(LFS 포인터 아님) 취득일·출처 URL·md5 가 README 에 기록됐는지
    runner: src.stages.h00_collect:inventory
    depends_on: []
    inputs:
      - docs/data_access_log.md
      - data/raw/README.md
      - "data/raw/land_cover/**/*"
      - "data/raw/dem/**/*"
    outputs:
      - artifacts/validation/collection_geo.json
    params: []
    verify:
      - {kind: code, rule: "계약의 해당 dataset 파일이 전부 존재, LFS 포인터 0개, README 에 취득일·URL·md5 기록"}
      - {kind: human, rule: "출처가 환경부 EGIS·국토지리정보원 공식인지, 최신판인지 (지형·피복은 기간 개념 없음 — 최신 1세트, DEM 해상도·CRS 기록)"}
    on_fail: {goto: h00_collect_geo, max_iterations: 5, action: "누락·구버전이면 재다운로드/재청구하고 README 에 취득 기록 후 재실행"}

  h01_contract_rainfall:
    gate: H01
    phase: P1
    title: 강수량 원본 검증
    description: data_contracts 의 [rainfall_hourly] 에 대해 구조(파일 수·컬럼·CRS)와 품질(중복·날짜·범위·센티널)을 검사하고 waiver 를 적용
    runner: src.stages.h01_contract:run_group
    depends_on: [h00_collect_rainfall]
    inputs:
      - config/data_contracts.yaml
      - config/raw_quality_waivers.yaml
      - artifacts/validation/collection_rainfall.json
    outputs:
      - artifacts/validation/raw_validation_rainfall.json
    params: []
    verify:
      - {kind: code, rule: "구조 error 0"}
      - {kind: code, rule: "미승인 warning 0 — 품질 warning 은 waiver(사유·정제규칙·만료일) 로만 H02 에 이관"}
      - {kind: human, rule: "통계값·좌표·기간을 보고 '이 데이터를 분석에 써도 되는가' 판단 (못 쓰면 decisions 에 대안)"}
    approval: {who: R1, what: "강수량 waiver 승인 및 사용 가능 판정 (임계치 완화 금지)"}
    on_fail: {goto: h00_collect_rainfall, max_iterations: 5, action: "구조 error(파일·컬럼·CRS 불일치)면 수집부터 다시. 품질 warning 이면 waiver 작성 후 이 노드만 재실행"}

  h01_contract_river:
    gate: H01
    phase: P1
    title: 하천수위 원본 검증
    description: data_contracts 의 [river_level_hourly] 에 대해 구조(파일 수·컬럼·CRS)와 품질(중복·날짜·범위·센티널)을 검사하고 waiver 를 적용
